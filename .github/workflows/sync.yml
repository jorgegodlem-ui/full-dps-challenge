name: Actualizar ranking

on:
  schedule:
    # Minutos raros a proposito: GitHub retrasa las corridas programadas cuando
    # hay mucha carga, y los peores momentos son en punto y a los cuartos de hora.
    # Correr en :07 :22 :37 :52 baja bastante la probabilidad de que se salte.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ranking
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Consultar la API de Riot
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          RIOT_STREAK: "0"
        run: node scripts/riot-sync.mjs

      - name: Commitear si cambió algo
        run: |
          git config user.name "ranking-bot"
          git config user.email "actions@github.com"
          git add data/ranking.json data/historial.json
          git diff --staged --quiet || git commit -m "ranking: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      # El webhook de GitHub -> Netlify se cayo sin aviso y el sitio quedo 15 horas
      # atrasado mientras el repo estaba al dia. Este build hook lo publica a la
      # fuerza, sin depender de esa integracion. Si el secret no existe, no hace nada.
      - name: Pedirle a Netlify que publique
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Sin NETLIFY_BUILD_HOOK: se depende del webhook de GitHub."
            exit 0
          fi
          curl -sS -X POST -d {} "$HOOK" > /dev/null
          echo "Deploy pedido a Netlify."
